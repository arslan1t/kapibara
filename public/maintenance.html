<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Капибара — скоро вернёмся</title>
<style>
  :root { color-scheme: light }
  * { box-sizing: border-box }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 24px;
    font-family: ui-rounded, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #fdf6ec 0%, #f8e4d5 100%);
    color: #3a2a1e;
  }
  .card {
    max-width: 520px; text-align: center; background: rgba(255,255,255,.7);
    border-radius: 28px; padding: 48px 32px;
    box-shadow: 0 18px 50px rgba(122, 80, 50, .12);
  }
  h1 { font-size: 28px; margin: 0 0 12px; line-height: 1.25 }
  p { font-size: 17px; line-height: 1.6; margin: 0 0 8px; color: #6b5445 }
  .dot { color: #b5551f }
</style>
</head>
<body>
  <div class="card">
    <h1>Скоро вернёмся<span class="dot">.</span></h1>
    <p>Магазин временно закрыт на технические работы.</p>
    <p>Загляните чуть позже — книги никуда не денутся.</p>
  </div>
</body>
</html>
